[project]
name = "ferrum-fm"
version = "0.1.1"
description = "A fast, stable, DE-agnostic TUI file manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "aiofiles>=23.0.0",
    "smbprotocol>=1.12.0",
    "send2trash>=1.8.0",
    "keyring>=24.0.0",
    "keyrings.alt>=4.0.0",
    "rich>=13.0.0",
    "jeepney>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
fe = "ferrum.main:run"
ferrum = "ferrum.main:run"

# Import package stays `ferrum` (directory ferrum/). Distribution name on PyPI is ferrum-fm.
# debian_deps wheels stay in-repo for the .deb build path only — excluded from sdist/wheel below.

[tool.hatch.build.targets.wheel]
packages = ["ferrum"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/debian_deps",
  "/deb_dist",
  "/dist",
  "/.venv",
  "/.pytest_cache",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
