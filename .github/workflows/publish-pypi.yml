# Trusted Publishing (OIDC) — no long-lived PyPI token in GitHub secrets.
# One-time PyPI setup (before first run):
#   1. Create/claim project https://pypi.org/manage/project/ferrum-fm/ (or publish once manually)
#   2. PyPI → Project → Publishing → Add a new pending publisher:
#        Owner: CerealOveride
#        Repository: ferrum
#        Workflow: publish-pypi.yml
#        Environment name: pypi   (must match `environment:` below)
#   3. In GitHub repo Settings → Environments, create environment "pypi"
#      (optional protection rules / required reviewers).
#
# Triggers: published GitHub Release, or manual workflow_dispatch.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish ferrum-fm
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
